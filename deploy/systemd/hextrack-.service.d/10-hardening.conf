# Shared by every unit whose name starts with "hextrack-": the api/worker/bot/migrate units and
# the transient hextrack-admin-* runs started by /usr/local/sbin/hextrack-admin.
# Installed as /etc/systemd/system/hextrack-.service.d/10-hardening.conf.
[Service]
WorkingDirectory=/opt/hextrack/current/api
# The venv holds only dependencies; the hextrack package comes from the release's source tree.
Environment=PYTHONPATH=/opt/hextrack/current/api/src PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
# No home directory: torch / matplotlib caches go to CacheDirectory= (units that set it).
Environment=HOME=/nonexistent XDG_CACHE_HOME=/var/cache/hextrack MPLCONFIGDIR=/var/cache/hextrack/matplotlib

# --- filesystem ---
UMask=0077
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible
InaccessiblePaths=-/srv/nfs -/run/baron -/etc/baron -/opt/baron -/var/lib/baron
InaccessiblePaths=-/etc/hextrack/credentials -/var/backups/hextrack

# --- privileges ---
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
RemoveIPC=yes
PrivateIPC=yes

# --- kernel / syscalls ---
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
SystemCallArchitectures=native
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes

# --- network: Postgres over its Unix socket, Riot / Discord / Data Dragon over TCP ---
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
